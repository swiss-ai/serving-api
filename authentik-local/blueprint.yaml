# Local Authentik: OIDC app for `make run` against docker-compose.
#
# Mirrors the shape of rob-poc/authentik/*/blueprints/serving-api.yaml so
# local auth behaves like the deployed instances (same grant types, same
# groups claim, same callback path — the auth-astro provider id stays
# `auth0`, so the callback is /api/auth/callback/auth0 everywhere).
#
# Everything here is LOCAL ONLY: fixed client secret, localhost redirect
# URIs, implicit consent. Never reuse any of these values in a deployment.
version: 1
metadata:
  name: serving-api-local
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: scope-serving-api-groups
    identifiers:
      name: serving-api-groups
    attrs:
      name: serving-api-groups
      scope_name: groups
      description: "serving-api group membership claim"
      expression: |
        groups = [group.name for group in request.user.ak_groups.all()]
        serving = {"serving-admin", "serving-user", "serving-viewer"}
        if not serving.intersection(groups):
            groups.append("serving-user")
        return {"groups": groups}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-serving-api-local
    identifiers:
      name: serving-api-local-provider
    attrs:
      name: serving-api-local-provider
      client_type: confidential
      # Defaults to an empty list, which rejects every authorize request —
      # must be set explicitly. refresh_token because the frontend requests
      # offline_access.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: "serving-api-local"
      client_secret: "local-dev-secret-not-for-deployment"
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      access_code_validity: minutes=1
      access_token_validity: hours=24
      refresh_token_validity: days=30
      # Implicit consent: no "authorize this app?" screen on every local login.
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - { url: "http://localhost:4321/api/auth/callback/auth0", matching_mode: strict, redirect_uri_type: authorization }
        - { url: "http://localhost:4321", matching_mode: strict, redirect_uri_type: logout }
      property_mappings:
        - !KeyOf scope-serving-api-groups
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]

  # The slug fixes the issuer: http://localhost:9000/application/o/serving-api-local/
  - model: authentik_core.application
    id: app-serving-api-local
    identifiers:
      slug: serving-api-local
    attrs:
      name: serving-api (local)
      slug: serving-api-local
      provider: !KeyOf provider-serving-api-local

  # Ordinary (non-admin) login for testing the regular-user perspective —
  # the bootstrap admin (admin@localhost) is seeded is_admin on the API
  # side, so without this every local view would be the admin view.
  - model: authentik_core.user
    identifiers:
      username: user@localhost
    attrs:
      username: user@localhost
      name: Local User
      email: user@localhost
      password: user
      is_active: true
