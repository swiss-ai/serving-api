# Authentik setup for backend/tests/test_e2e_authentik.py. TEST ONLY.
#
# The real login is authorization_code in a browser. To get a genuine
# Authentik access token without one, this provider also allows
# client_credentials, authenticating as a user with an app password. The
# token is then checked by the backend exactly as in prod: discovery ->
# userinfo -> email -> API key.
#
# Fixed secrets are fine here: the container is throwaway and unreachable.
version: 1
metadata:
  name: serving-api-e2e
entries:
  - model: authentik_core.user
    id: e2e-user
    identifiers:
      username: e2e-signup
    attrs:
      name: E2E Signup
      email: e2e-signup@example.org
      is_active: true

  - model: authentik_core.token
    identifiers:
      identifier: e2e-signup-app-password
    attrs:
      user: !KeyOf e2e-user
      intent: app_password
      key: e2e-app-password-not-a-secret
      expiring: false

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-serving-api-e2e
    identifiers:
      name: serving-api-e2e-provider
    attrs:
      name: serving-api-e2e-provider
      client_type: confidential
      grant_types:
        - authorization_code
        - client_credentials
      client_id: "serving-api-e2e"
      client_secret: "e2e-client-secret-not-a-secret"
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_token_validity: minutes=10
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - { url: "http://localhost/callback", matching_mode: strict, redirect_uri_type: authorization }
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  # Slug fixes the issuer: <authentik>/application/o/serving-api-e2e/
  - model: authentik_core.application
    identifiers:
      slug: serving-api-e2e
    attrs:
      name: serving-api (e2e)
      slug: serving-api-e2e
      provider: !KeyOf provider-serving-api-e2e
